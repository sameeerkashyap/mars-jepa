[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marsworld"
version = "0.1.0"
description = "Physics-Informed JEPA world model for Martian climate dynamics"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MarsWorld" }]
dependencies = [
    "numpy>=1.23",
    "torch>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
benchmark = [
    "scipy>=1.10,<2",
    "matplotlib>=3.7,<4",
    "pandas>=1.5,<3",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
marsworld-generate = "scripts.generate_data:main"
marsworld-train = "scripts.train:main"

[tool.setuptools]
py-modules = ["config", "paths"]
package-dir = {"" = "src", "scripts" = "scripts", "benchmarks" = "benchmarks"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["models*", "physics*", "training*", "data*", "benchmarks*", "scripts*"]
namespaces = false

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Preserve the pilot's compact scientific notation during the folder move.
"scripts/pilot/*.py" = ["E702", "E731", "E741"]
"tests/pilot/*.py" = ["E702", "E731", "E741"]
"tests/test_smoke.py" = ["E402"]  # torch imports follow importorskip

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
