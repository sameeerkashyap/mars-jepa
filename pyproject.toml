[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marsworld"
version = "0.1.0"
description = "Physics-Informed JEPA world model for Martian climate dynamics"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MarsWorld" }]
dependencies = [
    "numpy>=1.23",
    "torch>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
marsworld-generate = "scripts.generate_data:main"
marsworld-train = "scripts.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
