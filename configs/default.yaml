# Default configuration for the single-parameter (surface temperature) PI-JEPA.
# Every key maps to a field in marsworld.config dataclasses; omitted keys fall
# back to the dataclass defaults.

data:
  parameter: temperature       # proof-of-concept parameter; "dust" is future work
  grid_size: 32
  n_trajectories: 256
  trajectory_length: 24
  dt: 0.1
  diffusivity: 0.15
  seed: 0
  data_dir: data
  train_fraction: 0.7
  val_fraction: 0.15
  data_fraction: 1.0           # set <1.0 for data-efficiency experiments

model:
  in_channels: 1
  hidden_channels: 32
  latent_dim: 128
  forcing_dim: 2               # (wind_x, wind_y)
  predictor_hidden: 256
  ema_decay: 0.996

physics:
  enabled: true                # false => pure-JEPA baseline (model B)
  pde_weight: 0.1
  conservation_weight: 0.05
  diffusivity: 0.15            # must match data.diffusivity for a valid residual
  dt: 0.1

train:
  epochs: 50
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.00001
  jepa_weight: 1.0
  forecast_weight: 1.0
  rollout_steps: 1             # increase for multi-step rollout training
  num_workers: 4
  device: auto                 # auto | cpu | cuda
  log_every: 10
  checkpoint_dir: checkpoints
  seed: 0
